version: 2

updates:
  - package-ecosystem: npm
    directories:
      - /
      - /mcp-server
      - /web_interface/static/js/browser-ml/umap-wasm
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Copenhagen
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Copenhagen
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns:
          - "*"
