version: 2

updates:
  - package-ecosystem: npm
    directories:
      - /
      - /mcp-server
      - /web_interface/static/js/browser-ml/umap-wasm
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Copenhagen
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch

  # Generated copy of /mcp-server (scripts/build-mcp.js). Updates land in
  # /mcp-server and are mirrored by `npm run build`, so ignore everything here.
  # Listing the directory is required: unlisted manifests still get security PRs.
  - package-ecosystem: npm
    directory: /web_interface/static/mcp-server
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Copenhagen
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns:
          - "*"
