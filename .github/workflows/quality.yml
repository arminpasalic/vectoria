name: Quality

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Tests, build, and audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mcp-server/package-lock.json
            web_interface/static/js/browser-ml/umap-wasm/package-lock.json

      - name: Install application dependencies
        run: npm ci

      - name: Install UMAP-WASM test dependencies
        run: npm ci --prefix web_interface/static/js/browser-ml/umap-wasm

      - name: Install MCP dependencies
        run: npm ci --prefix mcp-server

      - name: Run application tests
        run: npm test

      - name: Run UMAP-WASM tests
        run: npm run test:wasm

      - name: Check JavaScript syntax
        run: npm run test:syntax

      - name: Verify generated MCP distribution
        run: |
          npm run build
          git diff --exit-code -- web_interface/static/mcp-server

      - name: Verify release cache stamp
        run: npm run stamp:check

      - name: Audit application tooling dependencies
        run: npm audit --audit-level=high

      - name: Audit MCP runtime dependencies
        run: npm audit --omit=dev --audit-level=high --prefix mcp-server
